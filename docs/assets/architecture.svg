<text x="88" y="791" font-size="23" style="fill:#586B77" class="">预设词元边界</text>
<text x="88" y="825" font-size="23" style="fill:#586B77" class="">理解嵌入与正弦位置编码</text>
<rect x="570" y="710" width="460" height="202" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
