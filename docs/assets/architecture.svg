<text x="982" y="375" font-size="23" style="fill:#586B77" class="">softmax · 加权聚合</text>
<path d="M 1228 345 L 1250 345" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
