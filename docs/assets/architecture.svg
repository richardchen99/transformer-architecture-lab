<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">从词元表示到上下文聚合</title><desc id="desc">沿数值计算理解注意力，在概念视图中建立整体架构认识。</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFAF5"/><stop offset="1" stop-color="#F2F7FA"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#586B77"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Avenir Next",sans-serif;fill:#22313D}.display{font-family:"Songti SC","Noto Serif CJK SC",Charter,serif;font-weight:700}.small{letter-spacing:2px;font-weight:600}</style>
</defs>
<rect width="1600" height="1060" rx="24" fill="url(#paper)"/>
<text x="64" y="58" font-size="19" style="fill:#AA8244" class="small">机制图谱  /  01</text>
<text x="64" y="121" font-size="45" style="fill:#22313D" class="display">从词元表示到上下文聚合</text>
<text x="64" y="165" font-size="23" style="fill:#586B77" class="">沿数值计算理解注意力，在概念视图中建立整体架构认识。</text>
