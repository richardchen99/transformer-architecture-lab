<text x="684" y="341" font-size="23" style="fill:#586B77" class="">固定线性投影</text>
<text x="684" y="375" font-size="23" style="fill:#586B77" class="">单个注意力计算核心</text>
<path d="M 930 345 L 952 345" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
