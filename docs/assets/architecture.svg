<text x="594" y="825" font-size="23" style="fill:#586B77" class="">开关控制可视通道</text>
<rect x="1076" y="710" width="460" height="202" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="1100" y="753" font-size="27" style="fill:#22313D" class="" font-weight="600">解码过程演示</text>
<text x="1100" y="791" font-size="23" style="fill:#586B77" class="">掩码 · 候选分数 · 采样 · 缓存</text>
<text x="1100" y="825" font-size="23" style="fill:#586B77" class="">预设续写词元与候选分数</text>
<path d="M 64 988 L 1536 988" stroke="#CBD6DB" stroke-width="1.5" fill="none"/>
<text x="64" y="1023" font-size="18" style="fill:#586B77" class="">概念视图用于架构讲解，不执行完整 Transformer 前向计算。</text>
<text x="1536" y="1023" font-size="18" style="fill:#586B77" class="" text-anchor="end">Richard Chen  ·  AI 交互实验室</text>
