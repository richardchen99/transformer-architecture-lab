<text x="386" y="375" font-size="23" style="fill:#586B77" class="">Position variation</text>
<path d="M 632 345 L 654 345" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="660" y="260" width="270" height="170" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="684" y="303" font-size="25" style="fill:#22313D" class="" font-weight="600">Q · K · V</text>
<text x="684" y="341" font-size="23" style="fill:#586B77" class="">Fixed projections</text>
<text x="684" y="375" font-size="23" style="fill:#586B77" class="">One attention kernel</text>
<path d="M 930 345 L 952 345" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="958" y="260" width="270" height="170" rx="18" fill="#EDF4F8" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="982" y="303" font-size="25" style="fill:#22313D" class="" font-weight="600">Attention</text>
<text x="982" y="341" font-size="23" style="fill:#586B77" class="">Scale · mask</text>
<text x="982" y="375" font-size="23" style="fill:#586B77" class="">Softmax · readout</text>
<path d="M 1228 345 L 1250 345" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
