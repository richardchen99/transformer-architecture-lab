<text x="64" y="529" font-size="24" style="fill:#4E7E9D" class="" font-weight="600">Fixed data + explicit operations</text>
<text x="64" y="566" font-size="23" style="fill:#586B77" class="">No pretrained weights or model service.</text>
<path d="M 64 629 L 1536 629" stroke="#CBD6DB" stroke-width="1.5" fill="none"/>
<text x="64" y="678" font-size="19" style="fill:#AA8244" class="small">B  /  CONCEPTUAL TEACHING VIEWS</text>
<rect x="64" y="710" width="460" height="202" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="753" font-size="27" style="fill:#22313D" class="" font-weight="600">Token &amp; position views</text>
<text x="88" y="791" font-size="23" style="fill:#586B77" class="">Preset token boundaries</text>
<text x="88" y="825" font-size="23" style="fill:#586B77" class="">Embedding and sinusoidal intuition</text>
<rect x="570" y="710" width="460" height="202" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="594" y="753" font-size="27" style="fill:#22313D" class="" font-weight="600">Multi-head observatory</text>
<text x="594" y="791" font-size="23" style="fill:#586B77" class="">Authored relationship roles</text>
<text x="594" y="825" font-size="23" style="fill:#586B77" class="">Toggles change the visual lanes</text>
<rect x="1076" y="710" width="460" height="202" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="1100" y="753" font-size="27" style="fill:#22313D" class="" font-weight="600">Decoder walkthrough</text>
<text x="1100" y="791" font-size="23" style="fill:#586B77" class="">Mask · Logits · Sample · Cache</text>
<text x="1100" y="825" font-size="23" style="fill:#586B77" class="">Scripted tokens and candidate scores</text>
<path d="M 64 988 L 1536 988" stroke="#CBD6DB" stroke-width="1.5" fill="none"/>
<text x="64" y="1023" font-size="18" style="fill:#586B77" class="">Conceptual panels are not an end-to-end Transformer forward pass.</text>
<text x="1536" y="1023" font-size="18" style="fill:#586B77" class="" text-anchor="end">Richard Chen  ·  Interactive AI Research Labs</text>
