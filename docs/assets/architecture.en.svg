<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">From tokens to context</title><desc id="desc">The implemented attention path, with its surrounding teaching views.</desc>
<defs>
