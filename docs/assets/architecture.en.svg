<text x="684" y="517" font-size="25" style="fill:#22313D" class="" font-weight="600">Causal rule</text>
<text x="684" y="555" font-size="23" style="fill:#586B77" class="">Hide future positions</text>
<path d="M 930 528 L 1093 528 L 1093 434" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1256" y="474" width="270" height="112" rx="18" fill="#EDF5F0" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="1280" y="517" font-size="25" style="fill:#22313D" class="" font-weight="600">Math Console</text>
<text x="1280" y="555" font-size="23" style="fill:#586B77" class="">Check full row sums</text>
