<rect width="1600" height="1060" rx="24" fill="url(#paper)"/>
<text x="64" y="58" font-size="19" style="fill:#AA8244" class="small">MECHANISM ATLAS  /  01</text>
<text x="64" y="121" font-size="45" style="fill:#22313D" class="display">From tokens to context</text>
<text x="64" y="165" font-size="23" style="fill:#586B77" class="">The implemented attention path, with its surrounding teaching views.</text>
<text x="64" y="229" font-size="19" style="fill:#4E7E9D" class="small">A  /  NUMERICAL COMPUTATION</text>
