<text x="88" y="303" font-size="25" style="fill:#22313D" class="" font-weight="600">Example tokens</text>
<text x="88" y="341" font-size="23" style="fill:#586B77" class="">Fixed English and</text>
<text x="88" y="375" font-size="23" style="fill:#586B77" class="">Chinese sequences</text>
